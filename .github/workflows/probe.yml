name: Probe screen sharing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Interfaces
        run: ifconfig | grep -E '^[a-z]|inet ' ; curl -s --max-time 10 https://api.ipify.org; echo
      - name: Enable screen sharing
        run: |
          pw="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 8)"
          echo "::add-mask::$pw"
          echo "VNC_PASSWORD=$pw" >> "$GITHUB_ENV"
          VNC_PASSWORD="$pw" scripts/enable-screen-sharing.sh
          sudo pfctl -s rules 2>/dev/null | tail -5
      - name: Check over VNC
        run: |
          python3 -m venv "$RUNNER_TEMP/vnc"
          "$RUNNER_TEMP/vnc/bin/pip" install --quiet --disable-pip-version-check vncdotool==1.4.2 pillow==13.0.0
          "$RUNNER_TEMP/vnc/bin/python" scripts/vnc-check.py shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-shots
          path: shots
