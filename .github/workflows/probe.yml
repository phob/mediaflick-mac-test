name: Probe screen sharing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up
        run: |
          pw="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 24)"
          echo "::add-mask::$pw"
          echo "::add-mask::${pw:0:8}"
          echo "MAC_PASSWORD=$pw" >> "$GITHUB_ENV"
          MAC_PASSWORD="$pw" scripts/create-test-user.sh
          MAC_PASSWORD="$pw" scripts/enable-screen-sharing.sh
      - name: Apple auth
        run: |
          python3 -m venv "$RUNNER_TEMP/vnc"
          "$RUNNER_TEMP/vnc/bin/pip" install --quiet --disable-pip-version-check vncdotool==1.4.2 pillow==13.0.0
          mkdir -p shots
          "$RUNNER_TEMP/vnc/bin/python" - <<'PY'
          import os
          from vncdotool import api
          for attempt in (1, 2):
              c = api.connect("127.0.0.1::5900", username="tester", password=os.environ["MAC_PASSWORD"], timeout=90)
              c.pause(20 if attempt == 1 else 3)
              c.captureScreen(f"shots/{attempt}-a-connected.png")
              c.mouseMove(20, 10)
              c.mousePress(1)
              c.pause(2)
              c.captureScreen(f"shots/{attempt}-b-menu.png")
              c.keyPress("esc")
              c.pause(2)
              c.captureScreen(f"shots/{attempt}-c-esc.png")
              c.disconnect()
              print("attempt", attempt, "done")
          api.shutdown()
          PY
      - name: Sessions
        if: always()
        run: |
          ioreg -n Root -d1 -a | plutil -extract IOConsoleUsers xml1 -o - - | grep -A1 -E 'kCGSSessionOnConsoleKey|kCGSSessionUserNameKey|kCGSessionLoginDoneKey' | tr -d '\t\n'; echo
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-shots
          path: shots
